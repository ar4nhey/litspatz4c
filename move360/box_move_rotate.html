<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Frame Object Movement and Rotation</title>
    <script src="../js/aframe-v0.9.2.js"></script>
   <script src="../js/aframe-object-mover.js"></script>
</head>
<body>
    <a-scene>
        <!-- Define the box entity -->
        <a-box id="movingBox" position="0 1.6 -5" color="red"></a-box>

        <!-- Define the camera -->
        <a-camera position="0 1.6 0"></a-camera>
    </a-scene>

    <script>
        // Include the ObjectMover class
        // Create an instance of ObjectMover for the box
        const boxMover = new AframeMover('movingBox');

        // Set start and end positions
        boxMover.setStartPosition(0, 1.6, -5);
        boxMover.setEndPosition(2, 1.6, -20);
		boxMover.setLoop(true);
        // Set start and end rotations
        boxMover.setStartRotation(0, 0, 0);
        boxMover.setEndRotation(0, 360, 0);

        // Set duration
        boxMover.setDuration(2000); // 2 seconds

        // Start the movement
        boxMover.startMovement();
    </script>
</body>
</html>
