<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR.js - move - hiro - wizzard hat </title>
  <script src="../js/aframe.min.js"></script>
  <script src="../js/aframe-ar.js"> </script>
  <script src="../js/aframe-extras.js"></script>
  <script src="../js/ar-object-mover.js"></script>
<script>
        // Include the ObjectMover class
        // Create an instance of ObjectMover for the box
        const boxMover = new ARMover('movinghat');

        // Set start and end positions (x,y,z) 
        // x: -left/+right
        // y: -down/+up
        // z: -rear/+front
        boxMover.setStartPosition(-10, 0, 0);
        boxMover.setEndPosition(+10, 0, 0);
		    boxMover.setLoop(true);
        // Set start and end rotations - no rotation
        boxMover.setStartRotation(0, 0, 0);
        boxMover.setEndRotation(0, 0, 0);

        // Set duration
        boxMover.setDuration(4000); // 4 seconds

        // Start the movement
        boxMover.startMovement();
</script>


</head>
<body style="margin : 0px; overflow: hidden;">
  <a-scene embedded arjs>
  <a-marker preset="hiro">
      <a-cone id="78912379812" position="0.00 1.00 0.00" material="color: #26a269;opacity:0.5" rotation="0 0 0"  radius-bottom="0.40" height="1.00" ></a-cone>

      <!-- Comment for CYLINDER: Hat - base -->
      <a-cylinder id="1747831504151" position="0.00 0.50 0.00" material="color: #26a269;opacity:0.5" rotation="0 0 0"  radius="0.60" height="0.10" ></a-cylinder>

      <!-- Comment for SPHERE: Head -->
      <a-sphere id="1748960421097" position="0.00 0.10 0.00" material="color: #5e5c64;opacity:0.5" rotation="0 0 0"  radius="0.40" ></a-sphere>


  </a-marker>
  <a-light type="ambient" color="#FFF" light=""></a-light>
  <a-light type="point" color="#fff" position="0 3 0" light=""></a-light>
  <a-light type="point" color="#fff" position="3 3 0" light=""></a-light>
  <a-light type="point" color="#fff" position="-3 3 0" light=""></a-light>
  <a-light type="point" color="#fff" position="3 3 -3" light=""></a-light>
  <a-light type="point" color="#fff" position="-3 3 -3" light=""></a-light>
  <a-light type="point" color="#fff" position="1.5 3 0" light=""></a-light>

    <!-- Define the camera -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
