<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR.js - move - Elf running - hiro</title>
  <script src="../../js/aframe.min.js"></script>
  <script src="../../js/aframe-ar.js"> </script>
  <script src="../../js/aframe-extras.js"></script>
  <script src="../../js/ar-object-mover.js"></script>
  <script>
          // Include the ObjectMover class
          // Create an instance of ObjectMover for the box

          const elfMover = new ARMover('running','ar');
          //elfMover.setVisibleTimes([0.5,0.7]);

          // Set start and end positions (x,y,z)
          // x: -left/+right
          // y: -down/+up
          // z: -rear/+front
          elfMover.setStartPosition(0, 0, 0);
          elfMover.setMiddle1Position(2, -4.5, -15);
          elfMover.setMiddle2Position(2, -6, -30);
    		  elfMover.setEndPosition(1, -9, -45);


          // Loop - Repeat animation
          elfMover.setLoop(true);

          // Set start and end rotations - no rotation
          elfMover.setStartRotation(0, 3.0, 0);
          elfMover.setMiddle1Rotation(0, 3.14 , 0);
          elfMover.setMiddle2Rotation(0, 3.24, 0);
          elfMover.setEndRotation(0, 3.5, 0);

          // Set duration
          elfMover.setDuration(8000); // 4 seconds

          // Start the movement
          elfMover.startMovement();

  </script>

</head>
<body style="margin : 0px; overflow: hidden;">
  <a-scene embedded arjs>
  <a-marker preset="hiro">
      <a-entity running position="0 0 0">
		<a-entity
		position="0 0 0"
		rotation="0 0 0"
		scale="0.04 0.04 0.04"
		animation-mixer="loop: repeat"
		gltf-model="../../model3d/litspatz_elf_running_animation_bl3.glb"
		></a-entity>
      </a-entity>
      <a-box id="markerlocation" position="0 0 0" color="#c0c0c0" scale="1 0.02 1" material="opacity:0.7"></a-box>

   <a-light type="ambient" color="#FFF" light=""></a-light>
   <a-light type="point" color="#fff" position="0 3 0" light=""></a-light>
   <a-light type="point" color="#fff" position="3 3 0" light=""></a-light>
   <a-light type="point" color="#fff" position="-3 3 0" light=""></a-light>
   <a-light type="point" color="#fff" position="3 3 -3" light=""></a-light>
   <a-light type="point" color="#fff" position="-3 3 -3" light=""></a-light>
   <a-light type="point" color="#fff" position="1.5 3 0" light=""></a-light>

  </a-marker>

  <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
