<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR.js - move - Kirchgäßchen - Kanji</title>
  <script src="../../js/aframe.min.js"></script>
  <script src="../../js/aframe-ar.js"> </script>
  <script src="../../js/aframe-extras.js"></script>
  <script src="../../js/ar-object-mover.js"></script>
  <script>
          // Include the ObjectMover class
          // Create an instance of ObjectMover for the box
 // Include the ObjectMover class
        // Create an instance of ObjectMover for the box
        var scale4dist = 1.0;
        const runningMover = new ARMover('running','ar');
        runningMover.setScale4Dist(scale4dist);

        // Time stamps alternative hide/show
        // runningMover.setVisibleTimes([ 0.1 , 0.3 , 0.5 , 0.7 , 0.9]);
        // 0.1 = Hide after 10% of animation time
        // 0.3 = Show after 30% of animation time
        // 0.5 = Hide after 50% of animation time
        // ...
        // All positions are 3D coordinates (x,y,z)
        // x: -left/+right
        // y: -down/+up
        // z: -rear/+front
        // (0,0,0) is the marker position
        runningMover.setStartPositionVert(3 , -3 , 0);
        runningMover.setMiddle1PositionVert(3.5, -1,-0.5);
        runningMover.setMiddle2PositionVert(4, 1,-1);
        runningMover.setEndPositionVert(4.7, 1.5,-1.5);
        runningMover.setLoop(true);
        // Set start and end rotations - no rotation
        runningMover.setStartRotationVert(0,-0.2,0);
        runningMover.setEndRotationVert(0,0,0);
        var vScale = 1.5;
        runningMover.setStartScaleVert(vScale , vScale, vScale);
        vScale = 0.3;
        runningMover.setMiddle1ScaleVert(vScale, vScale, vScale);
        vScale = 0.2;
        runningMover.setMiddle2ScaleVert(vScale, vScale, vScale);
        vScale = 0.1;
        runningMover.setEndScaleVert(vScale, vScale, vScale);

        // Set duration
        runningMover.setDuration(16000); // i.e. 30000/1000 seconds

        // Start the movement
        runningMover.startMovement();

  </script>

</head>
<body style="margin : 0px; overflow: hidden;">
  <a-scene embedded arjs>
  <a-marker preset="kanji">
