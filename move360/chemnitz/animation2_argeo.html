
<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>AR.js - Chemnitz Animation 2 - am Rathaus - vertical Marker - Geolocation </title>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <!--
        <script src="../../js/aframe-1.2.0.js"></script>
        <script src="../../js/aframe-ar.js"> </script>
        <script src="../../js/aframe-1.7.0-extras.js"></script>
        -->
        <script src="../../js/aframe-object-mover.js"></script>
        <script>
        // Include the ObjectMover class
        // Create an instance of ObjectMover for the box
        const runningMover = new AframeMover('running','aframe');

        // Time stamps alternative hide/show
        // runningMover.setVisibleTimes([ 0.1 , 0.3 , 0.5 , 0.7 , 0.9]);
        // 0.1 = Hide after 10% of animation time
        // 0.3 = Show after 30% of animation time
        // 0.5 = Hide after 50% of animation time
        // ...
        // All positions are 3D coordinates (x,y,z)
        // x: -left/+right
        // y: -down/+up
        // z: -rear/+front
        // (0,0,0) is the marker position
        runningMover.setStartPosition(1 , 0 , 0);
        runningMover.setMiddle1Position(2,0,-20);
        runningMover.setMiddle2Position(4,0,-40);
        runningMover.setEndPosition(-1,0,-80);
        runningMover.setLoop(true);
        // Set start and end rotations - no rotation
        runningMover.setStartRotation(0,-0.2,0);
        runningMover.setEndRotation(0,0,0);

        // Set duration
        runningMover.setDuration(12000); // i.e. 30000/1000 seconds

        // Start the movement
        runningMover.startMovement();
        </script>
      </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            renderer="logarithmicDepthBuffer: true;"
            embedded
            loading-screen="enabled: false;"
            arjs="sourceType: webcam; debugUIEnabled: false;"
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="../../model3d/litspatz_elf_running_animation_mit_stab_bl3.glb"
                ></a-asset-item>
            </a-assets>
            <a-entity running position="0 0 0" >
              <a-entity
              position="0 0 0"
              rotation="0 0 0"
              scale="0.04 0.04 0.04"
              look-at="[gps-camera]"
              animation-mixer="loop: repeat"
              gps-entity-place="latitude: 50.83258172668246; longitude: 12.917393092296502  ;"
              gltf-model="../../model3d/litspatz_elf_running_animation_bl3.glb"
              ></a-entity>
              <a-box id="geolocation" position="0 0 0" color="#c0c0c0" scale="1 0.02 1" material="opacity:0.7"></a-box>
            </a-entity>
            <!--
            <a-entity running position="0 0 0" >
                <a-entity
                    look-at="[gps-camera]"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    scale="1.0 1.0 1.0"
                    gps-entity-place="latitude:   50.83258172668246; longitude: 12.917393092296502  ;"
                ></a-entity>
            </a-entity>
           -->
            <a-camera gps-camera rotation-reader></a-camera>
        </a-scene>
    </body>
</html>
