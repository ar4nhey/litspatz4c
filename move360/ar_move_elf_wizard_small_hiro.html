<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR.js - move - box - hiro</title>
  <script src="../js/aframe.min.js"></script>
  <script src="../js/aframe-ar.js"> </script>
  <script src="../js/aframe-extras.js"></script>
  <script src="../js/ar-object-mover.js"></script>
  <script>
          // Include the ObjectMover class
          // Create an instance of ObjectMover for the box
          //alert("Create boxMover instance");
          //const boxMover = new AframeMover('movingBox','ar');
          //const boxMover = new AframeMover('movingBox');
          const boxMover = new ARMover('movingwizzard','ar');

          // Set start and end positions (x,y,z)
          // x: -left/+right
          // y: -down/+up
          // z: -rear/+front
          boxMover.setStartPosition(-8, -3, -4);
          boxMover.setMiddlePosition(0, -3, -5);
  		    boxMover.setEndPosition(+8, -3, -7);
  		    boxMover.setLoop(true);
          // Set start and end rotations - no rotation
          boxMover.setStartRotation(0, 0, 0);
          boxMover.setEndRotation(0, 2, 0);

          // Set duration
          boxMover.setDuration(8000); // 4 seconds

          // Start the movement
          boxMover.startMovement();

  </script>

</head>
<body style="margin : 0px; overflow: hidden;">
  <a-scene embedded arjs>
  <a-marker preset="hiro">
      <a-entity
      movingwizzard 
      position="0 0 0"
      rotation="0 -1 0"
      scale="2.0 2.0 2.0"
      animation-mixer="loop: repeat"
      gltf-model="./model3d/elf_wizard_small.glb"
      ></a-entity>
    <a-box id="movingBox" movingbox position="0 0 0" color="red" size="2 0.5 1" material="opacity:0.7"></a-box>
    <a-box id="spinnerBox" spinner position="0 0 0" color="blue" material="opacity:0.7"></a-box>
  </a-marker>
  <a-light type="ambient" color="#FFF" light=""></a-light>
  <a-light type="point" color="#fff" position="0 3 0" light=""></a-light>
  <a-light type="point" color="#fff" position="3 3 0" light=""></a-light>
  <a-light type="point" color="#fff" position="-3 3 0" light=""></a-light>
  <a-light type="point" color="#fff" position="3 3 -3" light=""></a-light>
  <a-light type="point" color="#fff" position="-3 3 -3" light=""></a-light>
  <a-light type="point" color="#fff" position="1.5 3 0" light=""></a-light>

  <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
