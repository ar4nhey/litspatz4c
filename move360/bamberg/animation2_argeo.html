<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <title>AR.js - Bamberg Animation 1 Biblithek - Geolocation </title>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <!--
        <script src="../../js/aframe-1.2.0.js"></script>
        <script src="../../js/aframe-ar.js"> </script>
        <script src="../../js/aframe-1.7.0-extras.js"></script>
        -->
        <script src="../../js/ar-object-mover.js"></script>
        <script>
              // Include the ObjectMover class
              // Create an instance of ObjectMover for the box
              // const scale4dist = 1.0;
              const floatingMover = new ARMover('floating','ar');

              // Time stamps alternative hide/show
      		    // floatingMover.setVisibleTimes([ 0.1 , 0.3 , 0.5 , 0.7 , 0.9]);
              // 0.1 = Hide after 10% of animation time
              // 0.3 = Show after 30% of animation time
              // 0.5 = Hide after 50% of animation time
              // ...
              // All positions are 3D coordinates (x,y,z)
              // x: -left/+right
              // y: -down/+up
              // z: -rear/+front
              // (0,0,0) is the marker position
              floatingMover.setStartPosition(-20 , 0 , -20);
              floatingMover.setMiddle1Position(-10 , 0 , -10);
              floatingMover.setMiddle2Position(-5, 0 , -5);
              floatingMover.setEndPosition(0,0,0);
              floatingMover.setLoop(true);
              // Set start and end rotations for x-axis, y-axis, z-axis
              // Set the angles with radians e.g. 3.141593 = 180 degress
              floatingMover.setStartRotation(0 , 0 , 0);
              //floatingMover.setMiddle1Rotation(0 , 3.131593 , 0);
              //floatingMover.setMiddle2Rotation(0 , -1.5 , 0);
              floatingMover.setEndRotation(0 , 0 , 0);

              // Set the scales with 1.0 is not scale
              // var vScale = 1.0;
              //floatingMover.setStartScale(vScale, vScale, vScale);
              // vScale = 1.0;
              //floatingMover.setMiddle1Scale(vScale, vScale, vScale);
              // vScale = 1.0;
              //floatingMover.setMiddle2Scale(vScale, vScale, vScale);
              // vScale = 1.0;
              //floatingMover.setEndScale(vScale, vScale, vScale);

              // Set duration
              floatingMover.setDuration(30000); // i.e. 30000/1000 seconds

              // Start the movement
              floatingMover.startMovement();
            const boxMover = new AframeMover('movingbox','ar');
    //boxMover.setVisibleTimes([ 0.001 , 0.1 ]);

		// Set start and end positions (x,y,z)
		// x: -left/+right
		// y: -down/+up
		// z: -rear/+front
    //boxMover.setStartPosition(-25, -5.3, -25);
    //boxMover.setMiddle1Position(-15, -4, -15);
    //boxMover.setMiddle2Position(6, -4, -15);
    //boxMover.setEndPosition(2, -3, -10);
    //boxMover.setLoop(true);
    boxMover.setStartPosition(-25, -5.3, -25);
    boxMover.setMiddle1Position(-15, -4, -15);
    boxMover.setMiddle2Position(-12, -4, -12);
    boxMover.setEndPosition(-6, -3, -6);
    // Set start and end rotations - no rotation
    boxMover.setStartRotation(0, 0, 0);
    boxMover.setEndRotation(0, 2, 0);
    // Set duration
    boxMover.setDuration(vDuration); // 30 seconds

        </script>
      </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            renderer="logarithmicDepthBuffer: true;"
            embedded
            loading-screen="enabled: false;"
            arjs="sourceType: webcam; debugUIEnabled: false;"
        >
            <a-assets>
                <a-asset-item id="raft" src="../../model3d/ortwin_raft_no_sail.glb"></a-asset-item>
                <a-asset-item id="treasure3d" src="../../model3d/treasure-chest-cutted_2.glb"></a-asset-item>
            </a-assets>
            <!-- GEOLOCATION 1 - Bamberg Animation 2 Biblithekh
              -- Entity as reference point in scene
            -->
             <a-entity
                    look-at="[gps-camera]"
                    scale="10.0 1.0 1.0"
                    gps-entity-place="latitude: 49.89285171911777; longitude: 10.885854495876456;">
                  <!-- OBJECT 1 -----
                    placed in scene at (0 , 0 , 0)
                    with relative coordinate system for geolocation.
                    -->
                    <a-entity movingbox position="0 -13 0" rotation="0 0 0">
                    	<!--
                      -->
                      <a-entity gltf-model="#treasure"
                        scale="0.04 0.04 0.04"
                        position="0 0 0"
                        rotation="0 180 0"
                        animation-mixer></a-entity>
                    </a-entity>
                    <a-entity floating position="0 -13 0" rotation="0 0 0">
                       <a-entity gltf-model="#raft"
                	       position="0.3 0 1.2"
                	       scale="0.6 0.6 0.6"
                         rotation="-10 180 0"
                         animation-mixer>
                	      </a-entity>
                        <!-- Comment for CONE: Hat Cone -->
                        <!--
                        <a-entity position="0 0 3" rotation="0 0 0" scale="0.5 0.5 0.5">
                	        <a-cone id="78912379812" position="0.00 1.00 -0.50" material="color: #a32c30;opacity:0.7" rotation="0 0 0"  radius-bottom="0.40" height="1.00" ></a-cone>
                          <a-cylinder id="1747831504151" position="0.00 0.50 0.00" material="color: #a32c30;opacity:0.7" rotation="0 0 0"  radius="0.60" height="0.10" ></a-cylinder>
                          <a-sphere id="1748960421097" position="0.00 0.10 0.00" material="color: #5e5c64;opacity:0.7" rotation="0 0 0"  radius="0.40" ></a-sphere>
                        </a-entity>
                       -->
                    </a-entity>

            </a-entity>

            <a-camera gps-camera rotation-reader></a-camera>
        </a-scene>
    </body>
</html>
