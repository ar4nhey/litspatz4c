<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR.js - kanji - argon_raft.glb</title>
  <script src="../../js/aframe.min.js"></script>
  <script src="../../js/aframe-ar.js"> </script>
  <script src="../../js/aframe-extras.js"></script>

</head>
<body style="margin : 0px; overflow: hidden;">
  <a-scene embedded arjs>
   <!-- Load the 3D model -->
    <a-assets>
      <a-asset-item id="my3dmodel" src="../../model3d/argon_raft.glb"></a-asset-item>
      <!--
      <img id="sky" src="../../img360/Bamberg2_Kran.JPG">
      <a-asset-item id="treasure3d" src="../../model3d/treasure-chest-cutted_2.glb"></a-asset-item>
      <audio id="litspatz1audio" src="audio/animation1audio.mp3" preload="auto"></audio>
      <img id="logo4litspatz2remote" src="https://studien.bildungsforschung.uni-bamberg.de/litspatz_materialien/LitSpatzLogo.jpg">
      <img id="logo4litspatz" src="../../img/LitSpatzLogo.jpg">
      -->
    </a-assets>

  <a-marker preset="kanji">
    <a-entity position="0 0 0" rotation="-90 0 0">
      <a-entity
      position="0 0 0"
      scale="0.01 0.01 0.01"
      animation-mixer="loop: repeat"
      gltf-model="#my3dmodel"
      ></a-entity>
    </a-entity>
  </a-marker>
  <a-light type="ambient" color="#FFF" light=""></a-light>
  <a-light type="point" color="#fff" position="0 3 0" light=""></a-light>
  <a-light type="point" color="#fff" position="3 3 0" light=""></a-light>
  <a-light type="point" color="#fff" position="-3 3 0" light=""></a-light>
  <a-light type="point" color="#fff" position="3 3 -3" light=""></a-light>
  <a-light type="point" color="#fff" position="-3 3 -3" light=""></a-light>
  <a-light type="point" color="#fff" position="1.5 3 0" light=""></a-light>

  <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
