<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR.js - move - box - hiro</title>
  <script src="../js/aframe.min.js"></script>
  <script src="../js/aframe-ar.js"> </script>
  <script src="../js/aframe-extras.js"></script>
  <script src="../js/ar-object-mover.js"></script>
 <title>
     AR hiro Marker - Wizzard Hat
 </title>
</head>
    <body style='margin : 0px; overflow: hidden;'>
      <a-scene>
          <a-marker id="mymarker" preset="hiro">

            <!-- Comment for CONE: Hat Cone -->
            <a-cone id="78912379812" position="0.00 1.00 -0.50" material="color: #26a269;opacity:0.5" rotation="0 0 0"  radius-bottom="0.40" height="1.00" ></a-cone>

            <!-- Comment for CYLINDER: Hat - base -->
            <a-cylinder id="1747831504151" position="0.00 0.50 0.00" material="color: #26a269;opacity:0.5" rotation="0 0 0"  radius="0.60" height="0.10" ></a-cylinder>

            <!-- Comment for SPHERE: Head -->
            <a-sphere id="1748960421097" position="0.00 0.10 0.00" material="color: #5e5c64;opacity:0.5" rotation="0 0 0"  radius="0.40" ></a-sphere>

          </a-marker>
          <a-entity camera ></a-entity>
      </a-scene>
    </body>
</html>
